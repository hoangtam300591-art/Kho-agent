<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hội đồng Kho vận</title>
<style>
  :root{
    --bg:#15171a;
    --bg-card:#1d2023;
    --line:#31353a;
    --amber:#f5a623;
    --amber-dim:#8a6420;
    --text:#e8e6e1;
    --text-dim:#8a8f96;
    --red:#e0554f;
    --green:#5fb87a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    padding:0 0 60px;
  }
  header{
    padding:32px 20px 20px;
    border-bottom:2px solid var(--amber-dim);
    background:
      repeating-linear-gradient(135deg, transparent, transparent 18px, rgba(245,166,35,0.04) 18px, rgba(245,166,35,0.04) 36px);
  }
  .eyebrow{
    font-family:"Courier New",monospace;
    font-size:12px;
    letter-spacing:2px;
    color:var(--amber);
    text-transform:uppercase;
  }
  h1{
    margin:6px 0 4px;
    font-size:26px;
    font-weight:800;
    letter-spacing:-0.5px;
  }
  .sub{
    color:var(--text-dim);
    font-size:14px;
    line-height:1.5;
  }
  main{
    max-width:640px;
    margin:0 auto;
    padding:20px;
  }
  textarea{
    width:100%;
    min-height:110px;
    background:var(--bg-card);
    border:1px solid var(--line);
    border-radius:8px;
    color:var(--text);
    font-size:15px;
    padding:14px;
    resize:vertical;
    font-family:inherit;
  }
  textarea:focus{outline:1px solid var(--amber);}
  button#run{
    margin-top:14px;
    width:100%;
    padding:14px;
    background:var(--amber);
    color:#1a1300;
    border:none;
    border-radius:8px;
    font-size:16px;
    font-weight:700;
    letter-spacing:0.3px;
    cursor:pointer;
  }
  button#run:disabled{
    background:var(--amber-dim);
    color:#3a2c10;
    cursor:not-allowed;
  }
  #flow{
    margin-top:32px;
    position:relative;
  }
  #flow::before{
    content:"";
    position:absolute;
    left:19px;
    top:8px;
    bottom:8px;
    width:2px;
    background:var(--line);
  }
  .station{
    display:flex;
    gap:14px;
    margin-bottom:18px;
    position:relative;
  }
  .num{
    flex:0 0 40px;
    height:40px;
    border-radius:50%;
    background:var(--bg-card);
    border:2px solid var(--line);
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:"Courier New",monospace;
    font-weight:700;
    font-size:14px;
    color:var(--text-dim);
    z-index:1;
    flex-shrink:0;
  }
  .station.done .num{border-color:var(--amber);color:var(--amber);}
  .station.error .num{border-color:var(--red);color:var(--red);}
  .card{
    flex:1;
    background:var(--bg-card);
    border:1px solid var(--line);
    border-radius:10px;
    padding:16px;
    min-width:0;
  }
  .card .role{
    font-size:11px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    color:var(--amber);
    font-weight:700;
    margin-bottom:6px;
  }
  .card .body{
    font-size:14.5px;
    line-height:1.6;
    white-space:pre-wrap;
    color:var(--text);
  }
  .card .body.pending{color:var(--text-dim); font-style:italic;}
  .badge{
    display:inline-block;
    font-size:11px;
    font-weight:700;
    padding:2px 8px;
    border-radius:4px;
    margin-bottom:8px;
  }
  .badge.duyet{background:rgba(95,184,122,0.15); color:var(--green);}
  .badge.tuchoi{background:rgba(224,85,79,0.15); color:var(--red);}
  footer{
    text-align:center;
    color:var(--text-dim);
    font-size:12px;
    margin-top:40px;
    padding:0 20px;
  }
</style>
</head>
<body>

<header>
  <div class="eyebrow">HỘI ĐỒNG KHO VẬN · 5 TRẠM QUYẾT ĐỊNH</div>
  <h1>Hội đồng Kho vận</h1>
  <div class="sub">Nhập đề bài — hệ thống chạy tuần tự qua Chuyên gia kho → Trưởng phòng kho → Kế toán trưởng → Trợ lý giám đốc → Giám đốc kho.</div>
</header>

<main>
  <textarea id="input" placeholder="Ví dụ: Đề xuất cải tạo khu vực nhập hàng để giảm thời gian chờ xe tải xuống hàng..."></textarea>
  <button id="run">Chạy hội đồng</button>

  <div id="flow"></div>
</main>

<footer>Kết quả do AI tạo ra — luôn kiểm tra lại trước khi áp dụng, đặc biệt các nội dung liên quan thuế/kế toán.</footer>

<script src="app.js"></script>
</body>
</html>
